[metadata]
name = kairos
version = attr: kairos.__version__
license = MIT
description = Self-evolving AI agent with multi-provider LLM support, Telegram bot, web search, media download, email, peripheral control, and watchdog kill switch.
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.9
install_requires =
    httpx>=0.24
    python-telegram-bot>=20.0
    pyserial>=3.5
    chromadb>=0.4
    beautifulsoup4>=4.12
    yt-dlp>=2023.10.13
    keyring>=24.0
    PySide6>=6.5
    soundcard>=0.4
    SpeechRecognition>=3.10
    pyttsx3>=2.90
    ddgs>=6.0
    lxml>=5.0
    pandas>=2.0
    openpyxl>=3.1
