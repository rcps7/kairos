name: Android

on:
  push:
    paths: ["android/**", "kairos/remote_api.py", "tests/test_remote_api.py", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "kairos/remote_api.py", "tests/test_remote_api.py", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      # Python + cryptography let RemoteTest talk to the real desktop remote server (interop).
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python deps for remote interop test
        run: python -m pip install --quiet "cryptography>=42" pytest
      - name: Unit tests (fdroid + full)
        run: gradle --no-daemon testFdroidDebugUnitTest testFullDebugUnitTest
        env: { KAIROS_PYTHON: python }
      - name: Build debug APKs (fdroid + full)
        run: gradle --no-daemon assembleFdroidDebug assembleFullDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kairos-debug-apks
          path: android/app/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/

  instrumented-test:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # The `full` flavour is used so the yt-dlp media test can run (the `fdroid` flavour
      # has no yt-dlp and skips it).
      - name: Run tests on Android 10 (API 29) emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          working-directory: android
          script: |
            gradle --no-daemon connectedFullDebugAndroidTest
            # AGP uninstalls the APKs when the connected test finishes, so rebuild,
            # reinstall and run only the screenshot test (am instrument keeps them
            # installed), then pull the PNGs from internal storage.
            gradle --no-daemon assembleFullDebug assembleFullDebugAndroidTest
            adb install -r app/build/outputs/apk/full/debug/app-full-debug.apk || true
            adb install -r -t app/build/outputs/apk/androidTest/full/debug/app-full-debug-androidTest.apk || true
            adb shell am instrument -w -e class org.kairos.agent.ScreenshotTest org.kairos.agent.test/androidx.test.runner.AndroidJUnitRunner || true
            mkdir -p screenshots
            adb shell run-as org.kairos.agent ls -l files/screenshots || true
            for f in $(adb shell run-as org.kairos.agent ls files/screenshots | tr -d '\r'); do adb exec-out run-as org.kairos.agent cat "files/screenshots/$f" > "screenshots/$f" || true; done
            ls -l screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kairos-screenshots
          path: android/screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-reports
          path: android/app/build/reports/androidTests/
