name: Android

on:
  push:
    paths: ["android/**", "kairos/remote_api.py", "tests/test_remote_api.py", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "kairos/remote_api.py", "tests/test_remote_api.py", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      # Python + cryptography let RemoteTest talk to the real desktop remote server (interop).
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python deps for remote interop test
        run: python -m pip install --quiet "cryptography>=42" pytest
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
        env: { KAIROS_PYTHON: python }
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kairos-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/

  instrumented-test:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run tests on Android 10 (API 29) emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: android
          script: gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-reports
          path: android/app/build/reports/androidTests/
