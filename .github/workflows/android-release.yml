name: Android release

# Builds the two release APKs and attaches them to the GitHub Release for the tag.
# Tags look like: v0.16.5-android.1
#
# Signing (optional but recommended): create a keystore once (see android/README.md),
# store it base64-encoded as the KAIROS_KEYSTORE_BASE64 secret, and set
# KAIROS_KEYSTORE_PASSWORD / KAIROS_KEY_ALIAS / KAIROS_KEY_PASSWORD. Without them the
# build falls back to the debug key so the APKs are still installable.
on:
  push:
    tags: ["v*-android.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach the APKs to"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    env:
      KAIROS_KEYSTORE_BASE64: ${{ secrets.KAIROS_KEYSTORE_BASE64 }}
      KAIROS_KEYSTORE_PASSWORD: ${{ secrets.KAIROS_KEYSTORE_PASSWORD }}
      KAIROS_KEY_ALIAS: ${{ secrets.KAIROS_KEY_ALIAS }}
      KAIROS_KEY_PASSWORD: ${{ secrets.KAIROS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }

      - name: Decode release keystore
        if: env.KAIROS_KEYSTORE_BASE64 != ''
        run: |
          echo "$KAIROS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kairos-release.p12"
          echo "KAIROS_KEYSTORE=$RUNNER_TEMP/kairos-release.p12" >> "$GITHUB_ENV"
          echo "Keystore decoded ($(stat -c%s "$RUNNER_TEMP/kairos-release.p12") bytes)."

      - name: Build release APKs
        run: gradle --no-daemon assembleFdroidRelease assembleFullRelease

      - name: Collect APKs and checksums
        run: |
          mkdir -p out
          cp app/build/outputs/apk/fdroid/release/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/full/release/*.apk out/ 2>/dev/null || true
          cd out && sha256sum *.apk > SHA256SUMS.txt 2>/dev/null || true
          ls -l

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          for f in out/*.apk; do echo "== $f"; "$APKSIGNER" verify --print-certs "$f" | head -4 || true; done

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Kairos for Android ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            android/out/*.apk
            android/out/SHA256SUMS.txt
          fail_on_unmatched_files: false
          overwrite_files: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kairos-release-apks
          path: android/out/*.apk
